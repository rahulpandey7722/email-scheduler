services:
  # Express API Web Service
  - type: web
    name: email-scheduler-api
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: email-scheduler-db
          property: connectionString
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: 6379
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: ethereal_demo_user
      - key: SMTP_PASS
        value: ethereal_demo_pass

  # Standalone Background Email Worker
  - type: worker
    name: email-scheduler-worker
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: email-scheduler-db
          property: connectionString
      - key: REDIS_HOST
        value: localhost
      - key: REDIS_PORT
        value: 6379
      - key: JWT_SECRET
        fromService:
          type: web
          name: email-scheduler-api
          property: JWT_SECRET
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: ethereal_demo_user
      - key: SMTP_PASS
        value: ethereal_demo_pass

# Managed PostgreSQL Database Service on Render
databases:
  - name: email-scheduler-db
    databaseName: email_scheduler
    user: postgres
